server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames (index-XXXXXXXX.js/css) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app uses a hash-based router, so this is just a safety net —
    # any unknown path still gets index.html instead of an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
